# Linux container ctest for the self-hosted Gitea act_runner (Docker via Colima).
# Each matrix OS maps to a runner docker label backed by a PREBUILT deps image
# (psopt-deps:local / psopt-deps-2604:local) containing ADOL-C(+ColPack)/IPOPT/
# MUMPS/Eigen built from source -- apt's ADOL-C lacks ColPack, so it can't be used.
# The image bakes the dep install tree at $PSOPT_DEPS, so CI is just configure/build/test.
name: ctest-linux

on:
  push:
    paths-ignore: [ '**.md', 'docs/**', 'wiki/**' ]
  workflow_dispatch:

jobs:
  ctest-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      PSOPT_DEPS: /sb/_deps/install
    steps:
      - uses: actions/checkout@v4

      - name: Configure (unit + example tests; HEADLESS so gnuplot writes PDFs)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PSOPT_DEPS" -DIPOPT_ROOT="$PSOPT_DEPS"
          -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON -DHEADLESS=ON

      - name: Build PSOPT + test suite + examples
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest (unit + all examples; per-test threads pinned)
        working-directory: build
        run: ctest --output-on-failure -j"$(nproc)"
